<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Result — QuizFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%237C5CFC'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EQ%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/quizflow.css?v=8" />
  <link rel="stylesheet" href="assets/css/result.css?v=8" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a class="nav-brand" href="dashboard.html">
        <span class="brand-mark">Q</span>
        QuizFlow
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="result.html?mode=list">Results</a>
        <a class="nav-link" href="leaderboard.html">Leaderboard</a>
      </nav>
      <div class="nav-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="backLink">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          Back
        </button>
        <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>

  <main>
    <div class="result-wrap" id="resultWrap">

      <div class="result-loading text-center" id="resultLoading">
        <div class="spinner" style="margin:0 auto; border-color: rgba(124,92,252,.3); border-top-color:#fff;"></div>
        <p class="mt-2">Loading results…</p>
      </div>

      <!-- Single attempt view -->
      <div class="hidden" id="singleView">

        <div class="glass-card result-hero">
          <div class="score-ring" id="scoreRing">
            <svg viewBox="0 0 176 176">
              <defs>
                <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#7C5CFC"/>
                  <stop offset="55%" stop-color="#3B82F6"/>
                  <stop offset="100%" stop-color="#22D3EE"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="88" cy="88" r="78"/>
              <circle class="ring-fill" id="ringFill" cx="88" cy="88" r="78"/>
            </svg>
            <div class="score-inner">
              <div class="pct" id="scorePct">0%</div>
              <div class="label">Score</div>
            </div>
          </div>
          <div class="result-copy">
            <div class="result-cat" id="resCat">—</div>
            <h1 id="resTitle">—</h1>
            <div class="verdict"><span class="result-badge" id="resBadge">—</span></div>
            <div class="result-stats" id="resStats"></div>
          </div>
        </div>

        <section class="result-section">
          <div class="section-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            Performance
          </div>
          <div class="perf-grid">
            <div class="glass-card perf-card">
              <h3 class="good">Strengths</h3>
              <div id="strengths"></div>
            </div>
            <div class="glass-card perf-card">
              <h3 class="weak">To Improve</h3>
              <div id="weaknesses"></div>
            </div>
          </div>
        </section>

        <section class="result-section">
          <div class="section-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
            Answer Review
          </div>
          <div class="review-summary" id="reviewSummary"></div>
          <div id="reviewList"></div>
        </section>
      </div>

      <!-- History list view -->
      <div class="hidden" id="listView">
        <div class="page-head">
          <div class="eyebrow">QuizFlow</div>
          <h1 class="page-title">My Results</h1>
        </div>
        <div id="historyList"></div>
      </div>
    </div>
  </main>

  <script src="assets/js/background.js?v=8"></script>
  <script src="assets/js/api.js?v=8"></script>
  <script src="assets/js/auth.js?v=8"></script>
  <script src="assets/js/result.js?v=8"></script>
</body>
</html>
